parameters:
  - name: 'TimeoutInMinutes'
    type: number
    default: 20

  - name: 'NugetConfigPath'
    type: string
    default: '$(System.DefaultWorkingDirectory)/nuget.config'

  - name: 'ScriptsDirectory'
    type: string
    default: '20250310_WantedProject'
  
  - name: 'ArtifactFeedName'
    type: string
    default: 'ScriptsFeed'

jobs:
  - job: ArtifactPublish
    pool: MyPool
    displayName: 'Publish scripts for Database Upgrade'
    timeoutInMinutes: '${{ parameters.TimeoutInMinutes }}'
    cancelTimeoutInMinutes: 2
    variables:
      - name: 'projectName'
        value: 'unset'
    steps:
      - checkout: self
        fetchDepth: 0
        
      # - powershell: Write-Host '##vso[task.setvariable variable=projectName;isOutput=true]${{ parameters.ScriptsDirectory }} -split "_"[1]'
      #   name: 'SplitProjectName'
      
      # - powershell: Write-Host ${projectName}
      #   name: 'Project_name'

      - powershell: |
          $projectName = "${{ parameters.ScriptsDirectory }}" -split "_"[1]
          Write-Host "##vso[task.setvariable variable=projectName;]$projectName"

      - powershell: |
          Write-Host "You can use macro syntax for variables: $(projectName)"

      - task: ArchiveFiles@2
        displayName: 'Archive script files'
        inputs:
          rootFolderOrFile: '$(System.DefaultWorkingDirectory)/DbUp-POC/Scripts/${variables.projectName}'
          archiveType: 'zip'
          archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'

      - task: UniversalPackages@0
        displayName: 'Publish scripts as artifact'
        inputs:
          command: publish
          publishDirectory: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
          vstsFeedPublish: 'dbupgrade-poc/${{ parameters.ArtifactFeedName }}'
          vstsFeedPackagePublish: '${variables.projectName}'
          versionPublish: '$(package_version)'
          packagePublishDescription: 'Scripts for ${{ parameters.ScriptsDirectory }}.'