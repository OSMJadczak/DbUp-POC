parameters:
  - name: 'TimeoutInMinutes'
    type: number
    default: 20

  - name: 'NugetConfigPath'
    type: string

  - name: 'ScriptsDirectory'
    type: string
  
  - name: 'ArtifactFeedName'
    type: string

  - name: 'FeedPackageName'
    type: string

jobs:
  - job: ArtifactPublish
    displayName: 'Publish scripts for Database Upgrade'
    timeoutInMinutes: '${{ parameters.TimeoutInMinutes }}'
    cancelTimeoutInMinutes: 2
    steps:
      - checkout: self
        fetchDepth: 0

      - task: ArchiveFiles@2
        displayName: 'Archive script files'
        inputs:
          rootFolderOrFile: '$(System.DefaultWorkingDirectory)/DbUp-POC/Scripts/${{ parameters.ScriptsDirectory}}'
          archiveType: 'zip'
          archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'

      - task: UniversalPackages@0
        displayName: 'Publish scripts as artifact'
        inputs:
          command: publish
          publishDirectory: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
          vstsFeedPublish: 'dbupgrade-poc/${{ parameters.ArtifactFeedName }}/${{ parameters.ScriptsDirectory }}'
          vstsFeedPackagePublish: '${{ parameters.FeedPackageName }}'
          versionPublish: '$(package_version)'
          packagePublishDescription: 'Scripts for ${{ parameters.ScriptsDirectory }}.'