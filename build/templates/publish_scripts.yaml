parameters:
  - name: 'TimeoutInMinutes'
    type: number
    default: 20

  - name: 'NugetConfigPath'
    type: string
    default: '$(System.DefaultWorkingDirectory)/nuget.config'

  - name: 'ScriptsDirectory'
    type: string
    default: '20250310_WantedProject'
  
  - name: 'ArtifactFeedName'
    type: string
    default: 'ScriptsFeed'

jobs:
  - job: ArtifactPublish
    pool: MyPool
    displayName: 'Publish scripts for Database Upgrade'
    timeoutInMinutes: '${{ parameters.TimeoutInMinutes }}'
    cancelTimeoutInMinutes: 2
    variables:
      - name: 'projectName'
        value: 'unset'
      - name: 'archiveName'
        value: 'unset'
    steps:
      - checkout: self
        fetchDepth: 0

      - powershell: |
          $projectName = ("${{ parameters.ScriptsDirectory }}".ToLower()).split("_")[1]
          Write-Host "##vso[task.setvariable variable=projectName;]$projectName"

      - powershell: |
          $arch = ("$(projectName)" + ".zip")
          Write-Host "##vso[task.setvariable variable=archiveName;]$arch"

      - task: ArchiveFiles@2
        displayName: 'Archive script files'
        inputs:
          rootFolderOrFile: '$(System.DefaultWorkingDirectory)/DbUp-POC/Scripts/${{ parameters.ScriptsDirectory }}'
          archiveType: 'zip'
          archiveFile: $(archiveName)

      - powershell: |
          Write-Host ${projectName}
          
      - task: UniversalPackages@0
        displayName: 'Publish scripts as artifact'
        inputs:
          command: publish
          publishDirectory: "$(System.DefaultWorkingDirectory)/$(archiveName)"
          vstsFeedPublish: 'dbupgrade-poc/${{ parameters.ArtifactFeedName }}'
          vstsFeedPackagePublish: '${projectName}'
          versionPublish: '$(package_version)'
          packagePublishDescription: 'Scripts for ${{ parameters.ScriptsDirectory }}.'